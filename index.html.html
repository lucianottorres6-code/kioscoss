<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kiosco Fácil</title><script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#1b1f24;--mu:#6b7280;--pr:#0f766e;--pt:#fff;--bd:#e5e7eb;--rd:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--cd:#1b2026;--tx:#eef0f3;--mu:#9aa3af;--pr:#2dd4bf;--pt:#042f2e;--bd:#2c333b;--rd:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--cd:#1b2026;--tx:#eef0f3;--mu:#9aa3af;--pr:#2dd4bf;--pt:#042f2e;--bd:#2c333b;--rd:#f87171;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:14px 16px;font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:center}main{flex:1;overflow:auto;padding:0 12px 12px}
nav{display:flex;border-top:1px solid var(--bd);background:var(--cd)}nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0;font:inherit;font-size:12px}nav span{display:block;font-size:20px}nav .on{color:var(--pr);font-weight:700}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 0 10px}.n{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.p,.g{font:inherit;border-radius:12px;padding:12px 16px;font-weight:600}.p{background:var(--pr);color:var(--pt);border:0}.g{background:none;color:var(--tx);border:1px solid var(--bd)}.w{width:100%;margin-top:8px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
#sh{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;justify-content:center;z-index:9}#sh.on{display:flex}
.bx{background:var(--cd);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px;max-height:92%;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}.bx h3{margin:0 0 6px}
.r{display:flex;gap:8px;margin-top:14px}.r>*{flex:1}.red{color:var(--rd)}.ck{display:flex;gap:8px;align-items:center;margin:10px 0}.ck input{width:auto;margin:0}
#t{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
</style></head><body><div id="app"><header id="h"></header><main id="m"></main>
<nav><button data-t="home" onclick="go('home')"><span>🏠</span>Inicio</button><button data-t="sell" onclick="go('sell')"><span>🛒</span>Vender</button><button data-t="prod" onclick="go('prod')"><span>📦</span>Productos</button><button data-t="ord" onclick="go('ord')"><span>🚚</span>Pedidos</button><button data-t="cash" onclick="go('cash')"><span>💵</span>Caja</button><button data-t="cli" onclick="go('cli')"><span>👥</span>Fiado</button></nav></div>
<div id="sh" onclick="if(event.target==this)cl()"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),UN={u:'Unidad',kg:'Kilo (kg)',g:'Gramo (g)',l:'Litro (L)'},UL={u:'u',kg:'kg',g:'g',l:'L'},PM=['Efectivo','Transferencia','QR','Débito','Fiado'];
let db=null;try{db=JSON.parse(localStorage.getItem('kf'))}catch(e){}
db=Object.assign({p:[],s:[],v:[],m:[],c:null,ch:[],cu:[],pg:[],pin:'',t0:Date.now()},db||{});
const save=()=>{try{localStorage.setItem('kf',JSON.stringify(db))}catch(e){}gq()},uid=()=>Math.random().toString(36).slice(2,9),$$=n=>'$'+Math.round(n).toLocaleString('es-AR'),fm=n=>+n.toFixed(2),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),P=id=>db.p.find(p=>p.id==id),stock=p=>p.lots.reduce((a,l)=>a+l.q,0),
d0=()=>{const d=new Date();d.setHours(0,0,0,0);return +d},S=a=>a.reduce((x,s)=>x+s.tot,0),G=a=>a.reduce((x,s)=>x+s.it.reduce((y,i)=>y+(i.pr-i.co)*i.q,0),0);
let own=!db.pin,fcv='',tab='home',cart=[],q='',pay='Efectivo',cb=null;const T={home:'Inicio',sell:'Vender',prod:'Productos',ord:'Pedidos',cash:'Caja',cli:'Fiado',rep:'Reportes'};
function go(t){tab=t;q='';render()}
function render(){if(!own&&(tab=='ord'||tab=='rep'))tab='home';$('#h').innerHTML='<span>'+T[tab]+'</span><button class="g" style="padding:6px 10px;font-size:13px" onclick="lk()">'+(own?'👤 Dueño':'👤 Empleado')+'</button>';document.querySelector('[data-t=ord]').style.display=own?'':'none';$('#m').innerHTML=({home,sell,prod,ord,cash,cli,rep})[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
function toast(m){const t=$('#t');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2200)}
function op(h){$('#sh').innerHTML='<div class="bx">'+h+'</div>';$('#sh').className='on'}function cl(){$('#sh').className=''}
function ask(t,l,f,d=''){cb=f;op(`<h3>${t}</h3><label>${l}</label><input id="ai" type="number" step="any" inputmode="decimal" value="${d}"><div class="r"><button class="g" onclick="cl()">Cancelar</button><button class="p" onclick="const v=parseFloat($('#ai').value);if(v>=0){const f=cb;cl();f(v)}">OK</button></div>`);setTimeout(()=>$('#ai').focus(),60)}
function conf(t,f){cb=f;op(`<h3>${t}</h3><div class="r"><button class="g" onclick="cl()">No</button><button class="p" onclick="const f=cb;cl();f()">Sí</button></div>`)}
function take(p,n){p.lots.sort((a,b)=>(a.d||'9')>(b.d||'9')?1:-1);for(const l of p.lots){if(l.q<=0)continue;const x=Math.min(l.q,n);l.q-=x;n-=x;if(n<=0)break}p.lots=p.lots.filter(l=>l.q>0);if(n>0)p.lots.push({q:-n,d:''})}
/* INICIO */
function home(){const D=d0(),t=db.v.filter(s=>s.t>=D),low=db.p.filter(p=>stock(p)<=p.mi),soon=[],top={};
db.p.filter(p=>p.exp).forEach(p=>p.lots.forEach(l=>{if(l.q>0&&l.d){const n=Math.ceil((new Date(l.d+'T00:00')-Date.now())/864e5);if(n<=7)soon.push({p,l,n})}}));
db.v.forEach(s=>s.it.forEach(i=>top[i.n]=(top[i.n]||0)+i.q));const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),sold=new Set(db.v.filter(s=>s.t>Date.now()-30*864e5).flatMap(s=>s.it.map(i=>i.id))),still=db.p.filter(p=>stock(p)>0&&!sold.has(p.id)&&Date.now()-(p.t||0)>30*864e5).slice(0,5);
return(db.p.length?'':`<div class="c"><b>👋 ¡Bienvenido!</b><div class="mu">1) Cargá tus productos en "Productos". 2) Vendé en "Vender". 3) Abrí la caja en "Caja".</div></div>`)+
`<div class="c"><div class="mu">Ventas de hoy</div><div class="n">${$$(S(t))}</div><div class="mu">${t.length} ventas${own?' · ganancia '+$$(G(t)):''}</div></div>`+
(low.length?`<div class="c"><b>⚠️ Por agotarse (${low.length})</b>${low.slice(0,6).map(p=>`<div class="row"><span>${esc(p.n)}</span><span class="mu">${fm(stock(p))} ${UL[p.u]}</span></div>`).join('')}${own?`<button class="g w" onclick="go('ord')">Ver pedidos</button>`:''}</div>`:'')+
(soon.length?`<div class="c"><b>⏰ Vencimientos cercanos</b>${soon.sort((a,b)=>a.n-b.n).slice(0,6).map(x=>`<div class="row"><span>${esc(x.p.n)} · ${fm(x.l.q)} ${UL[x.p.u]}</span><span class="${x.n<0?'red':'mu'}">${x.n<0?'vencido':'en '+x.n+' días'}${own&&x.n<0?` <button class="g" style="padding:4px 8px" onclick="bj('${x.p.id}',${x.p.lots.indexOf(x.l)})">Dar de baja</button>`:''}</span></div>`).join('')}</div>`:'')+
(tp.length?`<div class="c"><b>🔥 Más vendidos</b>${tp.map(x=>`<div class="row"><span>${esc(x[0])}</span><span class="mu">${fm(x[1])}</span></div>`).join('')}</div>`:'')+
(still.length?`<div class="c"><b>😴 Sin movimiento (30 días)</b>${still.map(p=>`<div class="row"><span>${esc(p.n)}</span><span class="mu">${fm(stock(p))} ${UL[p.u]}</span></div>`).join('')}</div>`:'')+
`<div class="c"><div class="mu">Desde el ${new Date(db.t0).toLocaleDateString('es-AR')}</div><div class="row"><span>Ventas totales</span><b>${db.v.length} · ${$$(S(db.v))}</b></div>${own?`<div class="row"><span>Ganancia total</span><b>${$$(G(db.v))}</b></div>`:''}</div>${own?`<button class="p w" style="margin:0 0 8px" onclick="go('rep')">📊 Ver reportes</button><button class="g w" onclick="bk()">💾 Copia de seguridad</button>`:''}`}
function bk(){op(`<h3>Copia de seguridad</h3>${gh()}<div class="mu">Tus datos viven en este dispositivo. Copiá este texto y guardalo (ej. enviátelo por WhatsApp). Para restaurar, pegá el texto acá y tocá Restaurar.</div><textarea id="bt" rows="6" onclick="this.select()">${esc(JSON.stringify(db))}</textarea><div class="r"><button class="g" onclick="navigator.clipboard&&navigator.clipboard.writeText($('#bt').value).then(()=>toast('Copiado'),()=>toast('Seleccioná y copiá'))">Copiar</button><button class="p" onclick="rs()">Restaurar</button></div>`)}
function rs(){try{const d=JSON.parse($('#bt').value);if(!d.p)throw 0;db=d;save();cl();render();toast('Restaurado')}catch(e){toast('Texto inválido')}}
/* VENDER */
const tot=()=>cart.reduce((a,i)=>a+i.q*P(i.id).pr,0);
function find(){const k=q.toLowerCase();return k?db.p.filter(p=>(p.n+' '+(p.bc||'')).toLowerCase().includes(k)).slice(0,8):[]}
function res(){return find().map(p=>`<div class="c row" onclick="add('${p.id}')"><div>${esc(p.n)}<div class="mu">${fm(stock(p))} ${UL[p.u]} en stock</div></div><b>${$$(p.pr)}${p.u!='u'?'/'+UL[p.u]:''}</b></div>`).join('')||(q?'<div class="mu">No encontrado</div>':'')}
function sell(){return `<input id="sq" placeholder="🔍 Buscar por nombre o código" value="${esc(q)}" oninput="q=this.value;$('#res').innerHTML=res()" onkeydown="if(event.key=='Enter')ent()"><div id="res">${res()}</div><div id="cart">${cartH()}</div>`}
function ent(){const k=q.trim(),p=db.p.find(p=>p.bc&&p.bc==k)||find()[0];if(p)add(p.id)}
function put(id,n){const c=cart.find(c=>c.id==id);c?c.q+=n:cart.push({id,q:n});q='';render()}
function add(id){const p=P(id);p.u=='u'?put(id,1):ask(p.n,'¿Cuántos '+UL[p.u]+'?',v=>v>0&&put(id,v))}
function chg(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);rc()}
function edq(i){const p=P(cart[i].id);ask(p.n,'Cantidad ('+UL[p.u]+')',v=>{v>0?cart[i].q=v:cart.splice(i,1);rc()},cart[i].q)}
function rc(){$('#cart').innerHTML=cartH()}
function cartH(){if(!cart.length)return '<div class="mu" style="text-align:center;margin-top:30px">Buscá un producto para empezar a vender</div>';
return `<div class="c">${cart.map((c,i)=>{const p=P(c.id);return `<div class="row"><div onclick="edq(${i})">${esc(p.n)}<div class="mu">${fm(c.q)} ${UL[p.u]} × ${$$(p.pr)}</div></div><div><b>${$$(c.q*p.pr)}</b> ${p.u=='u'?`<button class="g" onclick="chg(${i},-1)">−</button> <button class="g" onclick="chg(${i},1)">+</button>`:`<button class="g" onclick="chg(${i},-999999)">✕</button>`}</div></div>`}).join('')}</div>
<div class="row"><b>Total</b><span class="n">${$$(tot())}</span></div><div class="r" style="flex-wrap:wrap">${PM.map(m=>`<button class="${pay==m?'p':'g'}" style="flex:1 1 40%" onclick="pay='${m}';rc()">${m}</button>`).join('')}</div>
${pay=='Fiado'?`<select id="fcl" onchange="fcv=this.value" style="margin-top:8px"><option value="">¿Quién se lo lleva?</option>${db.cu.map(c=>`<option value="${c.id}" ${fcv==c.id?'selected':''}>${esc(c.n)}</option>`).join('')}</select><button class="g w" style="margin-top:0" onclick="cus()">+ Nuevo cliente</button>`:''}
${pay=='Efectivo'?`<label>Paga con (opcional)</label><input id="pg" type="number" inputmode="decimal" oninput="const v=+this.value;$('#vl').textContent=v>${tot()}?'Vuelto: '+$$(v-${tot()}):''"><div id="vl" class="n"></div>`:''}
<button class="p w" onclick="cobrar()">Cobrar ${$$(tot())}</button><button class="g w" onclick="cart=[];rc()">Vaciar</button>`}
function cobrar(){if(!cart.length)return;if(pay=='Fiado'&&!fcv){toast('Elegí el cliente');return}const it=cart.map(c=>{const p=P(c.id);take(p,c.q);db.m.push({t:Date.now(),id:p.id,q:-c.q,k:'venta'});return{id:p.id,n:p.n,q:c.q,pr:p.pr,co:p.co}});
db.v.push({id:uid(),t:Date.now(),it,tot:tot(),pay,cl:pay=='Fiado'?fcv:''});cart=[];fcv='';save();render();toast('✅ Venta registrada')}
/* PRODUCTOS */
function prod(){return `<input placeholder="🔍 Buscar producto" value="${esc(q)}" oninput="q=this.value;$('#pl').innerHTML=pl()">${own?`<button class="p w" style="margin:0 0 10px" onclick="pf()">+ Nuevo producto</button>`:''}<div id="pl">${pl()}</div>`}
function pl(){const k=q.toLowerCase(),a=db.p.filter(p=>(p.n+' '+(p.bc||'')).toLowerCase().includes(k));return a.map(p=>`<div class="c row" ${own?`onclick="pf('${p.id}')"`:''}><div>${esc(p.n)}<div class="mu ${stock(p)<=p.mi?'red':''}">${fm(stock(p))} ${UL[p.u]}</div></div><b>${$$(p.pr)}</b></div>`).join('')||'<div class="mu">Todavía no hay productos</div>'}
function pf(id){const p=id?P(id):{n:'',u:'u',pr:'',co:'',mi:'',su:'',bc:'',exp:false,lots:[]};
op(`<h3>${id?'Editar':'Nuevo'} producto</h3><label>Nombre</label><input id="fn" value="${esc(p.n)}"><label>¿Cómo se cuenta?</label><select id="fu">${Object.entries(UN).map(([k,v])=>`<option value="${k}" ${p.u==k?'selected':''}>${v}</option>`).join('')}</select>
<label>Precio de venta (por unidad / kg / litro)</label><input id="fp" type="number" inputmode="decimal" value="${p.pr}"><label>Costo</label><input id="fc" type="number" inputmode="decimal" value="${p.co}">
<label>Avisarme cuando queden (mínimo)</label><input id="fm" type="number" inputmode="decimal" value="${p.mi}"><label>Proveedor</label><select id="fs"><option value="">Sin proveedor</option>${db.s.map(s=>`<option value="${s.id}" ${p.su==s.id?'selected':''}>${esc(s.n)}</option>`).join('')}</select>
<label>Código de barras (opcional)</label><input id="fb" value="${esc(p.bc)}"><div class="ck"><input id="fx" type="checkbox" ${p.exp?'checked':''}><span>Controlar vencimiento</span></div>
${id?`<div class="c"><b>Stock: ${fm(stock(p))} ${UL[p.u]}</b>${p.exp?p.lots.filter(l=>l.q>0).sort((a,b)=>(a.d||'9')>(b.d||'9')?1:-1).map(l=>`<div class="row mu"><span>${fm(l.q)} ${UL[p.u]}</span><span>${l.d?'vence '+new Date(l.d+'T00:00').toLocaleDateString('es-AR'):'sin fecha'}</span></div>`).join(''):''}<div class="r"><button class="g" onclick="stk('${id}',1)">+ Sumar</button><button class="g" onclick="stk('${id}',-1)">− Restar</button></div></div>`:`<label>Stock inicial</label><input id="fi" type="number" inputmode="decimal"><label>Vencimiento del stock inicial (si controlás vencimiento)</label><input id="fd" type="date">`}
<div class="r"><button class="g" onclick="cl()">Cancelar</button><button class="p" onclick="sv('${id||''}')">Guardar</button></div>${id?`<button class="g w red" onclick="conf('¿Eliminar este producto?',()=>{db.p=db.p.filter(x=>x.id!='${id}');save();render()})">Eliminar</button>`:''}`)}
function sv(id){const g=x=>$('#'+x).value,n=g('fn').trim();if(!n||g('fp')===''){toast('Falta nombre o precio');return}
const o={n,u:g('fu'),pr:+g('fp'),co:+g('fc')||0,mi:+g('fm')||0,su:g('fs'),bc:g('fb').trim(),exp:$('#fx').checked};
if(id)Object.assign(P(id),o);else{const st=+g('fi')||0,p={id:uid(),t:Date.now(),...o,lots:st?[{q:st,d:o.exp?g('fd'):''}]:[]};db.p.push(p);if(st)db.m.push({t:Date.now(),id:p.id,q:st,k:'inicial'})}
save();cl();render();toast('Guardado')}
function stk(id,d){const p=P(id);op(`<h3>${d>0?'Sumar':'Restar'} · ${esc(p.n)}</h3><label>Cantidad (${UL[p.u]})</label><input id="sq2" type="number" step="any" inputmode="decimal">${d>0&&p.exp?'<label>Fecha de vencimiento</label><input id="sd" type="date">':''}${d<0?'<label>Motivo</label><select id="sm"><option>Rotura</option><option>Vencido</option><option>Pérdida</option><option>Ajuste</option></select>':''}<div class="r"><button class="g" onclick="cl()">Cancelar</button><button class="p" onclick="sk('${id}',${d})">Guardar</button></div>`)}
function sk(id,d){const p=P(id),n=+$('#sq2').value;if(!(n>0))return;
if(d>0){const dt=p.exp&&$('#sd')?$('#sd').value:'',l=p.lots.find(l=>l.d==dt&&l.q>0);l?l.q+=n:p.lots.push({q:n,d:dt});db.m.push({t:Date.now(),id,q:n,k:'compra'})}
else{take(p,n);db.m.push({t:Date.now(),id,q:-n,k:$('#sm').value})}save();cl();render();toast('Stock actualizado')}
/* PEDIDOS */
const sug=p=>Math.max(Math.ceil(p.mi*2-stock(p)),1);
function ord(){const g={};db.p.filter(p=>stock(p)<=p.mi).forEach(p=>(g[p.su||'']=g[p.su||'']||[]).push(p));const ks=Object.keys(g);
return `<button class="g w" style="margin:0 0 10px" onclick="sup()">+ Agregar proveedor</button>`+(db.s.length?`<div style="margin-bottom:6px">${db.s.map(s=>`<button class="g" style="margin:0 6px 8px 0;padding:6px 10px" onclick="sup('${s.id}')">${esc(s.n)} ✏️</button>`).join('')}</div>`:'')+(ks.length?'':`<div class="c"><b>Nada para pedir ✅</b><div class="mu">Cuando un producto baje de su mínimo aparece acá, separado por proveedor.</div></div>`)+
ks.map(k=>{const s=db.s.find(x=>x.id==k);return `<div class="c"><b>${s?esc(s.n):'Sin proveedor'}</b>${g[k].map(p=>`<div class="row" style="margin-top:8px"><div>${esc(p.n)}<div class="mu">Tenés ${fm(stock(p))} · mínimo ${p.mi} ${UL[p.u]}</div></div><input class="o o${k||'x'}" data-id="${p.id}" type="number" step="any" inputmode="decimal" placeholder="${sug(p)}" style="width:84px;margin:0"></div>`).join('')}<div class="mu" style="margin-top:6px">Escribí cuánto pedir (en gris, el sugerido)</div><div class="r"><button class="g" onclick="cp('${k}')">Copiar</button><button class="p" onclick="wa('${k}')">WhatsApp</button></div></div>`}).join('')}
function msg(k){const l=[...document.querySelectorAll('.o'+(k||'x'))].filter(i=>+i.value>0).map(i=>{const p=P(i.dataset.id);return `- ${p.n}: ${fm(+i.value)} ${UL[p.u]}`});return l.length?'Hola, quiero pedir:\n'+l.join('\n')+'\nGracias!':''}
function wa(k){const m=msg(k);if(!m)return toast('Escribí cantidades');const s=db.s.find(x=>x.id==k);window.open('https://wa.me/'+(s&&s.ph?s.ph.replace(/\D/g,''):'')+'?text='+encodeURIComponent(m),'_blank')}
function cp(k){const m=msg(k);if(!m)return toast('Escribí cantidades');navigator.clipboard?navigator.clipboard.writeText(m).then(()=>toast('Copiado'),()=>toast('No se pudo copiar')):toast('No se pudo copiar')}
function sup(id){const x=id?db.s.find(s=>s.id==id):{n:'',ph:''};op(`<h3>${id?'Editar':'Nuevo'} proveedor</h3><label>Nombre</label><input id="sn" value="${esc(x.n)}"><label>WhatsApp (con código de área, sin 0 ni 15)</label><input id="sp" type="tel" placeholder="54261..." value="${esc(x.ph||'')}"><div class="r"><button class="g" onclick="cl()">Cancelar</button><button class="p" onclick="const n=$('#sn').value.trim();if(n){const o={n,ph:$('#sp').value};${id?`Object.assign(db.s.find(s=>s.id=='${id}'),o)`:'db.s.push({id:uid(),...o})'};save();cl();render()}">Guardar</button></div>${id?`<button class="g w red" onclick="conf('¿Eliminar proveedor? Sus productos quedan sin proveedor.',()=>{db.p.forEach(p=>{if(p.su=='${id}')p.su=''});db.s=db.s.filter(s=>s.id!='${id}');save();render()})">Eliminar</button>`:''}`)}
/* CAJA */
function cinfo(){const c=db.c,v=db.v.filter(s=>s.t>=c.t),by={};PM.forEach(m=>by[m]=0);v.forEach(s=>by[s.pay]+=s.tot);db.pg.filter(x=>x.t>=c.t).forEach(x=>by[x.m]+=x.a);const eg=c.e.reduce((a,b)=>a+b,0);return{by,ex:c.i+by.Efectivo-eg,eg}}
function cash(){const H=db.ch.slice(-5).reverse().map(h=>`<div class="row mu"><span>${new Date(h.t1).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'})}</span><span>${h.cnt-h.ex==0?'Cuadró':(h.cnt-h.ex>0?'Sobró ':'Faltó ')+$$(Math.abs(h.cnt-h.ex))}</span></div>`).join('');
if(!db.c)return `<div class="c"><b>Caja cerrada</b><div class="mu">Abrila con el efectivo con el que empezás.</div><button class="p w" onclick="ask('Abrir caja','Efectivo inicial ($)',v=>{db.c={t:Date.now(),i:v,e:[]};save();render()},0)">Abrir caja</button></div>`+(H?`<div class="c"><b>Últimos cierres</b>${H}</div>`:'');
const x=cinfo();return `<div class="c"><div class="mu">Efectivo que debería haber</div><div class="n">${$$(x.ex)}</div><div class="mu">Inicial ${$$(db.c.i)} + ventas en efectivo − retiros ${$$(x.eg)}</div></div>
<div class="c"><b>Cobrado por otros medios (automático)</b>${PM.slice(1,-1).map(m=>`<div class="row"><span>${m}</span><b>${$$(x.by[m])}</b></div>`).join('')}<div class="row mu"><span>Fiado (a cobrar)</span><span>${$$(x.by.Fiado)}</span></div></div>
<button class="g w" onclick="ask('Retiro o gasto','Monto sacado de la caja ($)',v=>{db.c.e.push(v);save();render()})">Retiro / gasto</button><button class="p w" onclick="cerrar()">Cerrar caja</button>`}
function cerrar(){const x=cinfo();ask('Cerrar caja','¿Cuánto efectivo contaste? ($)',v=>{db.ch.push({t0:db.c.t,t1:Date.now(),i:db.c.i,ex:x.ex,cnt:v,by:x.by});db.c=null;save();render();const d=v-x.ex;op(`<h3>Caja cerrada</h3><div class="n">${d==0?'✅ Cuadra perfecto':d>0?'Sobran '+$$(d):'Faltan '+$$(-d)}</div><div class="mu">Esperado ${$$(x.ex)} · contado ${$$(v)}</div><div class="r"><button class="p" onclick="cl()">Listo</button></div>`)})}
/* GOOGLE DRIVE (paso 1: backup) */
const CID='PEGAR_AQUI_TU_CLIENT_ID.apps.googleusercontent.com',SC='https://www.googleapis.com/auth/drive.appdata',FN='kiosco-backup.json',LS=localStorage;
let tk=null,tkx=0,gtm;const gl=()=>!!LS.getItem('kfg'),cfg=()=>!CID.startsWith('PEGAR');
function gtoken(ui){return new Promise((ok,no)=>{if(tk&&Date.now()<tkx)return ok(tk);if(!cfg()||!window.google||!google.accounts)return no('x');
google.accounts.oauth2.initTokenClient({client_id:CID,scope:SC,error_callback:no,callback:r=>{if(r.error)return no(r.error);tk=r.access_token;tkx=Date.now()+(r.expires_in-60)*1e3;ok(tk)}}).requestAccessToken({prompt:ui?'consent':''})})}
async function gf(u,o={}){const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+tk,...(o.headers||{})}});if(!r.ok)throw r.status;return r}
async function gid(){const r=await(await gf('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,modifiedTime)&q='+encodeURIComponent("name='"+FN+"'"))).json();return r.files[0]||null}
async function gup(){await gtoken(false);const f=await gid(),b=JSON.stringify(db);let r;
if(f&&LS.getItem('kfm')&&f.modifiedTime!=LS.getItem('kfm'))throw 'conflict';
if(f)r=await gf('https://www.googleapis.com/upload/drive/v3/files/'+f.id+'?uploadType=media&fields=modifiedTime',{method:'PATCH',headers:{'Content-Type':'application/json'},body:b});
else{const d='kf';r=await gf('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=modifiedTime',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+d},body:`--${d}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:FN,parents:['appDataFolder']})}\r\n--${d}\r\nContent-Type: application/json\r\n\r\n${b}\r\n--${d}--`})}
LS.setItem('kfm',(await r.json()).modifiedTime);LS.setItem('kfu',Date.now())}
function gq(){if(!gl())return;clearTimeout(gtm);gtm=setTimeout(()=>gup().then(()=>{},e=>toast(e=='conflict'?'⚠️ Otro dispositivo guardó cambios en Drive. Abrí Copia de seguridad':'⚠️ Sin copia en Drive: abrí Copia de seguridad')),20000)}
function gh(){const u=+LS.getItem('kfu');return `<div class="c"><b>☁️ Google Drive</b>${!cfg()?'<div class="mu">Falta configurar el ID de Google (lo hace quien instala el sistema).</div>':gl()?`<div class="mu">Conectado · última copia: ${u?new Date(u).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):'todavía ninguna'}. Se guarda sola cuando hacés cambios. Usalo en un solo dispositivo por ahora.</div><div class="r"><button class="p" onclick="gnow()">Guardar ahora</button><button class="g" onclick="grest()">Restaurar</button></div>`:`<div class="mu">Guardá tus datos en tu Drive para no perderlos si cambiás o perdés el celular.</div><button class="p w" onclick="gnow()">Conectar Google Drive</button>`}</div>`}
async function gnow(){try{await gtoken(true);const was=gl(),f=await gid();LS.setItem('kfg',1);
if(!was&&f){if(!db.p.length)return gdl();op(`<h3>Ya hay una copia en Drive</h3><div class="mu">¿Qué datos querés conservar?</div><div class="r"><button class="g" onclick="cl();LS.setItem('kfm',${JSON.stringify(f.modifiedTime)});gup().then(()=>toast('Subido a Drive'))">Los de este celular</button><button class="p" onclick="cl();gdl()">Los de Drive</button></div>`);return}
await gup();toast('✅ Guardado en Drive');bk()}catch(e){toast(e=='conflict'?'⚠️ Hay cambios más nuevos en Drive: tocá Restaurar':'No se pudo conectar con Google')}}
async function gdl(){try{await gtoken(true);const f=await gid();if(!f)return toast('No hay copia en Drive');const d=await(await gf('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media')).json();if(!d.p)throw 0;db=d;own=!db.pin;LS.setItem('kfm',f.modifiedTime);LS.setItem('kfu',Date.now());save();cl();render();toast('Restaurado desde Drive')}catch(e){toast('No se pudo restaurar')}}
function grest(){conf('¿Reemplazar los datos de este dispositivo por los de Drive?',gdl)}
/* REPORTES */
let rg=7;
function bj(id,i){const p=P(id),l=p.lots[i];conf('¿Dar de baja '+fm(l.q)+' '+UL[p.u]+' vencidos de '+p.n+'?',()=>{db.m.push({t:Date.now(),id,q:-l.q,k:'Vencido'});p.lots.splice(i,1);save();render();toast('Dado de baja')})}
function an(id){const s=db.v.find(x=>x.id==id);s.it.forEach(i=>{const p=P(i.id);if(!p)return;const l=p.lots.find(l=>!l.d);l?l.q+=i.q:p.lots.push({q:i.q,d:''});db.m.push({t:Date.now(),id:i.id,q:i.q,k:'anulación'})});db.v=db.v.filter(x=>x.id!=id);save();cl();render();toast('Venta anulada')}
function vd(id){const s=db.v.find(x=>x.id==id),c=s.cl&&db.cu.find(x=>x.id==s.cl);op(`<h3>Venta ${new Date(s.t).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'})}</h3>${s.it.map(i=>`<div class="row"><span>${esc(i.n)} · ${fm(i.q)}</span><span>${$$(i.pr*i.q)}</span></div>`).join('')}<div class="row"><b>Total</b><b>${$$(s.tot)}</b></div><div class="mu">${s.pay}${c?' · '+esc(c.n):''}</div><div class="r"><button class="g" onclick="cl()">Cerrar</button><button class="g red" onclick="conf('¿Anular esta venta? El stock vuelve.',()=>an('${id}'))">Anular</button></div>`)}
function rep(){const D=d0(),v=db.v.filter(s=>s.t>=D-(rg-1)*864e5),by={},day={},pr={},U=n=>{const p=db.p.find(p=>p.n==n);return p?UL[p.u]:'u'};
v.forEach(s=>{by[s.pay]=(by[s.pay]||0)+s.tot;const k=new Date(s.t).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'numeric'}),d=day[k]=day[k]||{t:0,n:0};d.t+=s.tot;d.n++;s.it.forEach(i=>{const x=pr[i.n]=pr[i.n]||{q:0,g:0};x.q+=i.q;x.g+=(i.pr-i.co)*i.q})});
const top=Object.entries(pr).sort((a,b)=>b[1].q-a[1].q).slice(0,8),sold=new Set(db.v.filter(s=>s.t>Date.now()-30*864e5).flatMap(s=>s.it.map(i=>i.id))),still=db.p.filter(p=>stock(p)>0&&!sold.has(p.id)&&Date.now()-(p.t||0)>30*864e5).slice(0,8);
return `<button class="g" style="margin-bottom:10px" onclick="go('home')">← Volver</button><div class="r" style="margin:0 0 10px">${[[1,'Hoy'],[7,'7 días'],[30,'30 días']].map(([n,l])=>`<button class="${rg==n?'p':'g'}" onclick="rg=${n};render()">${l}</button>`).join('')}</div>
<div class="c"><div class="mu">Vendido</div><div class="n">${$$(S(v))}</div><div class="row"><span class="mu">${v.length} ventas</span><span class="mu">ticket promedio ${$$(v.length?S(v)/v.length:0)}</span></div><div class="row"><span>Ganancia</span><b>${$$(G(v))}</b></div></div>
${v.length?`<div class="c"><b>Por medio de pago</b>${Object.entries(by).map(([k,x])=>`<div class="row"><span>${k}</span><b>${$$(x)}</b></div>`).join('')}</div>${rg>1?`<div class="c"><b>Por día</b>${Object.entries(day).reverse().map(([k,x])=>`<div class="row"><span>${k} <span class="mu">· ${x.n} ventas</span></span><b>${$$(x.t)}</b></div>`).join('')}</div>`:''}<div class="c"><b>Más vendidos</b>${top.map(([n,x])=>`<div class="row"><span>${esc(n)}</span><span class="mu">${fm(x.q)} ${U(n)} · ganó ${$$(x.g)}</span></div>`).join('')}</div>`:'<div class="mu" style="text-align:center;margin:20px">No hay ventas en este período</div>'}
${still.length?`<div class="c"><b>😴 Sin movimiento (30 días)</b>${still.map(p=>`<div class="row"><span>${esc(p.n)}</span><span class="mu">${fm(stock(p))} ${UL[p.u]}</span></div>`).join('')}</div>`:''}
<div class="c"><b>Últimas ventas</b>${db.v.slice(-10).reverse().map(s=>`<div class="row" onclick="vd('${s.id}')"><span>${new Date(s.t).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'})} <span class="mu">· ${s.pay}</span></span><b>${$$(s.tot)}</b></div>`).join('')||'<div class="mu">Sin ventas</div>'}<div class="mu">Tocá una venta para verla o anularla</div></div>`}
/* FIADO */
const dbt=c=>db.v.filter(s=>s.cl==c.id).reduce((a,s)=>a+s.tot,0)-db.pg.filter(x=>x.c==c.id).reduce((a,x)=>a+x.a,0);
function cli(){const a=db.cu.map(c=>({c,d:dbt(c)})).sort((x,y)=>y.d-x.d),T0=a.reduce((s,x)=>s+Math.max(x.d,0),0);
return `<div class="c"><div class="mu">Te deben en total</div><div class="n">${$$(T0)}</div></div><button class="p w" style="margin:0 0 10px" onclick="cus()">+ Nuevo cliente</button>`+(a.map(x=>`<div class="c row" onclick="cd('${x.c.id}')"><span>${esc(x.c.n)}</span><b class="${x.d>0?'red':''}">${$$(x.d)}</b></div>`).join('')||'<div class="mu">Todavía no hay clientes con fiado</div>')}
function cus(){op(`<h3>Nuevo cliente</h3><label>Nombre</label><input id="cn"><div class="r"><button class="g" onclick="cl()">Cancelar</button><button class="p" onclick="const n=$('#cn').value.trim();if(n){const c={id:uid(),n};db.cu.push(c);fcv=c.id;save();cl();render()}">Guardar</button></div>`)}
function cd(id){const c=db.cu.find(x=>x.id==id),d=dbt(c),h=[...db.v.filter(s=>s.cl==id).map(s=>({t:s.t,a:s.tot,k:'Compró'})),...db.pg.filter(x=>x.c==id).map(x=>({t:x.t,a:x.a,k:'Pagó'}))].sort((a,b)=>b.t-a.t).slice(0,10);
op(`<h3>${esc(c.n)}</h3><div class="n ${d>0?'red':''}">${$$(d)}</div><div class="mu">${d>0?'Debe':'Al día'}</div>${h.map(x=>`<div class="row mu"><span>${new Date(x.t).toLocaleDateString('es-AR')} · ${x.k}</span><span>${$$(x.a)}</span></div>`).join('')}<label>Registrar pago</label><input id="pa" type="number" inputmode="decimal"><select id="pm">${PM.slice(0,-1).map(m=>`<option>${m}</option>`).join('')}</select><div class="r"><button class="g" onclick="cl()">Cerrar</button><button class="p" onclick="const a=+$('#pa').value;if(a>0){db.pg.push({id:uid(),t:Date.now(),c:'${id}',a,m:$('#pm').value});save();cl();render();toast('Pago registrado')}">Cobrar</button></div>`)}
/* ROLES */
function lk(){if(!db.pin){op(`<h3>Crear PIN de dueño</h3><div class="mu">Con el PIN, el empleado no ve costos ni ganancias y no puede cargar stock.</div><label>PIN (4 números)</label><input id="pn" type="tel" maxlength="4"><div class="r"><button class="g" onclick="cl()">Cancelar</button><button class="p" onclick="const v=$('#pn').value;if(/^\d{4}$/.test(v)){db.pin=v;own=true;save();cl();render();toast('PIN creado')}else toast('Son 4 números')">Guardar</button></div>`);return}
if(own){own=false;go('home');toast('Modo empleado');return}
op(`<h3>Entrar como dueño</h3><label>PIN</label><input id="pn" type="tel" maxlength="4"><div class="r"><button class="g" onclick="cl()">Cancelar</button><button class="p" onclick="if($('#pn').value==db.pin){own=true;cl();render()}else toast('PIN incorrecto')">Entrar</button></div>`)}
render();
</script></body></html>
